
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 — Page Not Found | Olinda Vashi</title>
  <meta
    name="description"
    content="The page you are looking for could not be found."
  >

  <script>
    document.documentElement.dataset.theme =
      localStorage.getItem("theme") || "light";
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >
<link
  rel="stylesheet"
  href="/Personal_site_OlindaVashi-/css/styles.css"
>

<link
  rel="stylesheet"
  href="/Personal_site_OlindaVashi-/css/404.css"
>

<body>
  <header class="error-header">
   <a
  class="error-logo"
  href="/Personal_site_OlindaVashi-/"
  aria-label="Olinda Vashi homepage"
>
  OV<span>.</span>
</a>

    <button
      class="theme-toggle"
      type="button"
      aria-label="Switch to dark mode"
      aria-pressed="false"
    >
      <span class="theme-icon" aria-hidden="true">☾</span>
    </button>
  </header>

  <main class="error-page">
    <section
      class="error-content"
      aria-labelledby="error-title"
    >
      <p class="eyebrow">Error 404</p>

      <h1 id="error-title">Page Not Found</h1>

      <p class="error-message">
        Sorry, the page you are looking for does not exist
        or may have been moved.
      </p>

      <div class="error-actions">
        <a
  class="error-button error-button-primary"
  href="/Personal_site_OlindaVashi-/"
>
  Return to Homepage
</a>

        <a
  class="error-button error-button-secondary"
  href="/Personal_site_OlindaVashi-/#contact"
>
  Contact Me
</a>
      </div>
    </section>
  </main>

 <script
  src="/Personal_site_OlindaVashi-/script.js"
  defer
></script>
</html>
